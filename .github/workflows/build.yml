name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu indir
      uses: actions/checkout@v5

    - name: Klasör Yapısını Python ile Otomatik Düzenle
      run: |
        python3 -c '
        import os, shutil

        os.makedirs("app/src/main/java/com/tvos/launcher", exist_ok=True)
        os.makedirs("app/src/main/res/layout", exist_ok=True)

        for f in os.listdir("."):
            if not os.path.isfile(f):
                continue
            clean = f.strip()
            low = clean.lower()
            if low.endswith(".kt"):
                shutil.copy2(f, f"app/src/main/java/com/tvos/launcher/{clean}")
            elif "androidmanifest" in low:
                shutil.copy2(f, "app/src/main/AndroidManifest.xml")
            elif "item_app" in low:
                shutil.copy2(f, "app/src/main/res/layout/item_app.xml")
            elif "project" in low and "gradle" in low:
                shutil.copy2(f, "build.gradle.kts")
            elif "app" in low and "gradle" in low:
                shutil.copy2(f, "app/build.gradle.kts")

        if os.path.isdir("res"):
            shutil.copytree("res", "app/src/main/res", dirs_exist_ok=True)
        '

        rm -f build.gradle app/build.gradle
        printf 'android.useAndroidX=true\nkotlin.code.style=official\n' > gradle.properties
        ls -la app/

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle Kur
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Debug APK Oluştur
      run: gradle assembleDebug

    - name: APK Dosyasını Yükle
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
