name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu indir
      uses: actions/checkout@v5

    - name: Proje Yapısını Sıfırdan ve Hatasız Oluştur
      run: |
        mkdir -p app/src/main/java/com/tvos/launcher
        mkdir -p app/src/main/res/layout

        python3 -c '
        import os, shutil
        for f in os.listdir("."):
            if not os.path.isfile(f):
                continue
            low = f.strip().lower()
            if low.endswith(".kt"):
                shutil.copy2(f, f"app/src/main/java/com/tvos/launcher/{f.strip()}")
            elif "androidmanifest" in low:
                shutil.copy2(f, "app/src/main/AndroidManifest.xml")
            elif "item_app" in low:
                shutil.copy2(f, "app/src/main/res/layout/item_app.xml")
        if os.path.isdir("res"):
            shutil.copytree("res", "app/src/main/res", dirs_exist_ok=True)
        '

        # Eski yapılandırma dosyalarını temizle
        rm -f build.gradle build.gradle.kts settings.gradle settings.gradle.kts app/build.gradle app/build.gradle.kts

        # 1. Ana settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "tvos-launcher"
        include(":app")
        EOF

        # 2. Ana build.gradle.kts (Project)
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.5.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.24" apply false
        }
        EOF

        # 3. Uygulama app/build.gradle.kts (App)
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
            id("org.jetbrains.kotlin.android")
        }

        android {
            namespace = "com.tvos.launcher"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.tvos.launcher"
                minSdk = 28
                targetSdk = 34
                versionCode = 7
                versionName = "2.3-beta.3"
            }

            buildTypes {
                release {
                    isMinifyEnabled = false
                    proguardFiles(
                        getDefaultProguardFile("proguard-android-optimize.txt"),
                        "proguard-rules.pro"
                    )
                }
            }

            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = "17"
            }

            buildFeatures {
                viewBinding = true
            }
        }

        dependencies {
            implementation("androidx.core:core-ktx:1.13.1")
            implementation("androidx.appcompat:appcompat:1.7.0")
            implementation("com.google.android.material:material:1.12.0")
            implementation("androidx.recyclerview:recyclerview:1.3.2")
        }
        EOF

        # 4. gradle.properties
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        kotlin.code.style=official
        EOF

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle Kur
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'
 
    - name: Inter Font Kurulumu
      run: |
        mkdir -p app/src/main/assets/fonts
        curl -fL --retry 3 https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip -o /tmp/inter.zip
        unzip -j -o /tmp/inter.zip "extras/ttf/Inter-Regular.ttf" "extras/ttf/Inter-Medium.ttf" "LICENSE.txt" -d app/src/main/assets/fonts


    - name: Debug APK Oluştur
      run: gradle :app:assembleDebug

    - name: APK Dosyasını Yükle
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
