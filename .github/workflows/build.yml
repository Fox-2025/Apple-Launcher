name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk sade-ekran.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sade-ekran-apk
          path: sade-ekran.apk
      - name: Yayınla (Release)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest sade-ekran.apk --title "Sade Ekran (son sürüm)" --notes "Otomatik derlenen son APK." --target "$GITHUB_SHA"
