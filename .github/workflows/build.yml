name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu indir
      uses: actions/checkout@v5

    - name: Klasör Yapısını ve Ayarları Otomatik Düzenle
      run: |
        mkdir -p app/src/main/java/com/tvos/launcher
        mkdir -p app/src/main/res/layout

        cp -f *.kt* app/src/main/java/com/tvos/launcher/
        cp -f *AndroidManifest* app/src/main/AndroidManifest.xml
        cp -f *item_app* app/src/main/res/layout/item_app.xml
        cp -rf res/* app/src/main/res/

        rm -f build.gradle build.gradle.kts app/build.gradle app/build.gradle.kts
        cp -f *project* build.gradle.kts
        cp -f *App* app/build.gradle.kts

        rm -f settings.gradle settings.gradle.kts
        printf 'pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n}\ndependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\nrootProject.name = "Apple-Launcher"\ninclude(":app")\n' > settings.gradle.kts

        printf 'android.useAndroidX=true\nkotlin.code.style=official\n' > gradle.properties

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle Kur
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Debug APK Oluştur
      run: gradle assembleDebug

    - name: APK Dosyasını Yükle
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
