name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu indir
      uses: actions/checkout@v5

    - name: Klasör Yapısını ve Ayarları Otomatik Düzenle
      run: |
        mkdir -p app/src/main/java/com/tvos/launcher
        mkdir -p app/src/main/res/layout

        # Kotlin dosyalarını doğru paket klasörüne taşı
        cp -f *.kt app/src/main/java/com/tvos/launcher/ 2>/dev/null || true

        # Eski paket klasörü kaldıysa temizle
        rm -rf app/src/main/java/com/minilauncher

        # Manifest ve layout dosyalarını yerleştir
        [ -f "AndroidManifest.xml" ] && cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml
        [ -f "item_app.xml" ] && cp -f item_app.xml app/src/main/res/layout/item_app.xml
        [ -d "res" ] && cp -rf res/* app/src/main/res/

        # Eski build.gradle dosyalarını silip .kts olarak yerleştir
        rm -f build.gradle build.gradle.kts app/build.gradle app/build.gradle.kts
        cp -f "build.gradle (project)" build.gradle.kts
        cp -f "build.gradle (App)" app/build.gradle.kts

        # settings.gradle.kts dosyasını Google deposuyla yeniden oluştur
        rm -f settings.gradle settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Apple-Launcher"
        include(":app")
        EOF

        # AndroidX desteği için gradle.properties oluştur
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        kotlin.code.style=official
        EOF

    - name: JDK 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle Kur
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Debug APK Oluştur
      run: gradle assembleDebug

    - name: APK Dosyasını Yükle
      uses: actions/upload-artifact@v5
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
