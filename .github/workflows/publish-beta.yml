name: Publish first beta APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-beta.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v1.0.0-beta.1
    steps:
      - name: Download verified debug build
        run: |
          gh run download 45616263884 --name app-debug --dir dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/Apple-Launcher-v1.0.0-beta.1.apk
      - name: Publish beta release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; not overwriting."
            exit 0
          fi
          gh release create "$TAG" dist/Apple-Launcher-v1.0.0-beta.1.apk \
            --target 401d5d89095edca94ab5f438157a52ec5549799e \
            --title "Apple Launcher v1.0.0-beta.1" \
            --prerelease \
            --notes "Android TV launcher initial beta. Android 9+ (API 28). Debug-signed APK from successful workflow run 45616263884. Device testing is pending. Future production signing may require uninstalling this beta before installing a differently signed version."
