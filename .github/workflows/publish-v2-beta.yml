name: Publish v2 beta APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v2-beta.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v2.0.0-beta.1
    steps:
      - name: Download verified APK
        run: |
          gh run download 45619312381 --name app-debug --dir dist
          test -s dist/app-debug.apk
          mv dist/app-debug.apk dist/Apple-Launcher-v2.0.0-beta.1.apk
      - name: Publish prerelease
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; not overwriting."
            exit 0
          fi
          gh release create "$TAG" dist/Apple-Launcher-v2.0.0-beta.1.apk \
            --target 4f68fe76a53582e6bfc0388a61f985a4c77a219f \
            --title "Apple Launcher v2.0.0-beta.1" \
            --prerelease \
            --notes "Redesigned tvOS-inspired Android TV home: dynamic shelf, landscape cards, demo mode, focus effects, favorites, hide/reorder and light/dark theme. Android 9+. Debug-signed APK from successful run 45619312381. TCL device testing pending. Existing beta may require uninstalling if its debug signing key differs."
