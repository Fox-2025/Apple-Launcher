name: TCL Channel Probe APK
on:
  push:
    branches: [diagnostics/tcl-channel-probe]
    paths:
      - diagnostics/channel-probe/**
      - .github/workflows/tcl-channel-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build independent debug APK
        shell: bash
        run: |
          set -euxo pipefail
          sdk="${ANDROID_HOME:?}"
          bt="$sdk/build-tools/34.0.0"
          platform="$sdk/platforms/android-34/android.jar"
          if [[ ! -f "$platform" || ! -x "$bt/d8" ]]; then
            sdkmanager "platforms;android-34" "build-tools;34.0.0"
          fi
          mkdir -p probe-build/classes probe-build/dex
          cat > probe-build/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.tvos.channelprobe" android:versionCode="1" android:versionName="1.0">
              <uses-sdk android:minSdkVersion="28" android:targetSdkVersion="30"/>
              <uses-feature android:name="android.software.leanback" android:required="false"/>
              <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>
              <uses-permission android:name="android.permission.READ_TV_LISTINGS"/>
              <queries><package android:name="com.tcl.tv"/></queries>
              <application android:label="TCL Kanal Testi" android:debuggable="true"
                  android:allowBackup="false" android:theme="@android:style/Theme.Material.NoActionBar">
                  <uses-library android:name="com.tcl.tvmanager" android:required="false"/>
                  <uses-library android:name="com.tcl.deviceinfo" android:required="false"/>
                  <uses-library android:name="com.tcl.os.storage" android:required="false"/>
                  <uses-library android:name="com.tcl.os.system" android:required="false"/>
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          javac -encoding UTF-8 -source 8 -target 8 -classpath "$platform" -d probe-build/classes diagnostics/channel-probe/MainActivity.java
          jar cf probe-build/classes.jar -C probe-build/classes .
          "$bt/d8" --min-api 28 --lib "$platform" --output probe-build/dex probe-build/classes.jar
          "$bt/aapt2" link -I "$platform" --manifest probe-build/AndroidManifest.xml -o probe-build/unsigned.apk
          (cd probe-build/dex && zip -j ../unsigned.apk classes.dex)
          "$bt/zipalign" -f 4 probe-build/unsigned.apk probe-build/aligned.apk
          keytool -genkeypair -keystore probe-build/debug.jks -storepass android -keypass android -alias androiddebugkey -dname "CN=TCL Channel Probe" -keyalg RSA -keysize 2048 -validity 10000
          "$bt/apksigner" sign --ks probe-build/debug.jks --ks-pass pass:android --key-pass pass:android --out probe-build/tcl-channel-probe.apk probe-build/aligned.apk
          "$bt/apksigner" verify --verbose probe-build/tcl-channel-probe.apk
          "$bt/aapt2" dump badging probe-build/tcl-channel-probe.apk
      - uses: actions/upload-artifact@v4
        with:
          name: tcl-channel-probe
          path: probe-build/tcl-channel-probe.apk
          if-no-files-found: error
